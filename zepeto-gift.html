    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDU-cVQatcbyA-RSM-zftZf1NH5q9fcFI",
            authDomain: "warung-757.firebaseapp.com",
            projectId: "warung-757",
            databaseURL: "https://warung-757-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.ACTIVE_RATE = 450;
        window.currentTotalPrice = 0;
        window.chosenMethod = null;

        onValue(ref(db, 'settings/zvg_rate'), (snap) => {
            const rate = snap.val();
            if(rate) {
                window.ACTIVE_RATE = parseInt(rate);
                document.getElementById('rate-display').innerText = `Rate: Rp ${rate}/Zem`;
                calculatePrice();
            }
        });

        window.onload = () => { setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 500); };

        window.calculatePrice = () => {
            const jumlah = document.getElementById('jumlah-zem').value || 0;
            window.currentTotalPrice = parseInt(jumlah) * window.ACTIVE_RATE;
            const pStr = "Rp " + window.currentTotalPrice.toLocaleString('id-ID');
            document.getElementById('p-qris').innerText = pStr;
            document.getElementById('p-bca').innerText = pStr;
            document.getElementById('p-dana').innerText = pStr;
            document.getElementById('footerPrice').innerText = pStr;
        };

        window.selectMetode = (el, m) => {
            window.chosenMethod = m;
            document.querySelectorAll('.method-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        };

        // FUNGSI KOMPRESI GAMBAR (PENTING AGAR BOT TIDAK CRASH)
        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        // Kecilkan resolusi ke 500px saja agar ringan di Discord
                        const MAX_WIDTH = 500;
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        // Kualitas 0.5 (50%) supaya file sizenya kecil
                        resolve(canvas.toDataURL('image/jpeg', 0.5));
                    };
                };
            });
        };

        window.processOrder = async () => {
            const fileBukti = document.getElementById('file-bukti').files[0];
            const fileItem = document.getElementById('item-photo').files[0];
            
            if(!fileBukti) return Swal.fire('Error', 'Upload bukti bayar!', 'error');
            
            Swal.fire({ title: 'Memproses Pesanan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // Kompresi ketat
                const imgBukti64 = await compressImage(fileBukti);
                
                const trxId = "ZVG-" + Math.floor(100000 + Math.random() * 900000);
                const now = new Date().toLocaleString('id-ID');
                
                // PERBAIKAN STRUKTUR DATA (SESUAI KEINGINAN BOT)
                const data = { 
                    id: trxId, 
                    product: document.getElementById('jumlah-zem').value + " ZEM GIFT",
                    price: window.currentTotalPrice, // KIRIM ANGKA SAJA (900), BUKAN TEKS "Rp 900"
                    status: "PROSES",
                    idz_penerima: document.getElementById('idz-user').value,
                    nama_zepeto: document.getElementById('name-user').value,
                    catatan: document.getElementById('catatan-item').value || "-",
                    wa_pembeli: "+62" + document.getElementById('wa-user').value,
                    email: document.getElementById('email-user').value,
                    metode: window.chosenMethod,
                    bukti_bayar: imgBukti64, // Hanya kirim 1 gambar utama ke bot agar stabil
                    date: now
                };
                
                await set(ref(db, 'transactions/' + trxId), data);
                
                // Simpan ke riwayat lokal
                let history = JSON.parse(localStorage.getItem('zepetoHistory')) || [];
                history.unshift(data);
                localStorage.setItem('zepetoHistory', JSON.stringify(history));

                Swal.close();
                document.getElementById('modalPayment').style.display = 'none';
                document.getElementById('pushNotif').classList.add('show');
                
                setTimeout(() => {
                    window.location.href = 'riwayat-transaksi.html';
                }, 2000);

            } catch(e) { 
                console.error(e);
                Swal.fire('Gagal', 'Sistem sibuk, coba lagi.', 'error'); 
            }
        };

        // Fungsi pembantu lainnya
        window.openPayment = () => {
            const idz = document.getElementById('idz-user').value;
            const nickname = document.getElementById('name-user').value;
            const jumlah = document.getElementById('jumlah-zem').value;
            const wa = document.getElementById('wa-user').value;
            const fileItem = document.getElementById('item-photo').files[0];

            if(!idz || !nickname || !fileItem || !jumlah || !window.chosenMethod || !wa) {
                Swal.fire('Lengkapi Data', 'Pastikan semua kolom dan foto item sudah diisi!', 'warning');
                return;
            }

            document.getElementById('textTotal').innerText = "Rp " + window.currentTotalPrice.toLocaleString('id-ID');
            document.getElementById('modalPayment').style.display = 'flex';
            
            const qrImg = document.getElementById('qrImg');
            const qrArea = document.getElementById('qrArea');
            const bankArea = document.getElementById('bankArea');

            if(window.chosenMethod === "BCA") {
                qrArea.style.display = 'none'; bankArea.style.display = 'block';
            } else if (window.chosenMethod === "QRIS DANA ONLY") {
                bankArea.style.display = 'none'; qrArea.style.display = 'block';
                qrImg.src = "https://i.ibb.co.com/n87h8ZVh/qr-ID1022167478307-25-02-26-177195989-1771959903434.jpg";
            } else {
                bankArea.style.display = 'none'; qrArea.style.display = 'block';
                qrImg.src = "https://i.ibb.co.com/chRN5qRT/1772040416685.png";
            }
        };

        window.showFile = (input) => { if(input.files[0]) document.getElementById('up-text').innerText = "✓ " + input.files[0].name; };
        window.previewItemPhoto = (input) => { if(input.files[0]) document.getElementById('item-photo-text').innerText = "✓ Foto Item Terpilih"; };
    </script>
