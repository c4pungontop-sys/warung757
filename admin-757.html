<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Owner Dashboard | Warung 757</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --dark-blue: #0a0e27;
            --royal-blue: #16215b;
            --gold: #d4af37;
            --gold-light: #f1d592;
            --white: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-gold: rgba(212, 175, 55, 0.2);
            --success: #2ecc71;
            --danger: #ff4d4d;
        }

        body {
            background: var(--dark-blue);
            background-image: radial-gradient(circle at top right, #16215b 0%, #0a0e27 100%);
            font-family: 'Poppins', sans-serif; color: var(--white); min-height: 100vh; 
            padding: 12px; overflow-x: hidden;
        }

        /* Login Overlay */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-blue); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: var(--card-bg); padding: 30px; border-radius: 25px; border: 1px solid var(--border-gold); width: 100%; max-width: 350px; text-align: center; backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .key-input { width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-gold); color: var(--gold-light); border-radius: 12px; margin: 20px 0; text-align: center; font-size: 1.1rem; letter-spacing: 5px; outline: none; }

        #admin-content { display: none; }
        .admin-container { max-width: 500px; margin: 0 auto; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, var(--royal-blue), var(--dark-blue)); padding: 15px 20px; border-radius: 15px; border: 1px solid var(--border-gold); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        .category-group { margin-bottom: 18px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 18px; border: 1px solid rgba(212,175,55,0.1); }
        .category-title { font-size: 0.7rem; color: var(--gold); margin-bottom: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(212,175,55,0.1); padding-bottom: 8px; }

        .product-card { background: rgba(0,0,0,0.3); border: 1px solid var(--border-gold); padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; transition: 0.3s; }
        .product-info { font-size: 0.75rem; font-weight: 500; flex-grow: 1; line-height: 1.4; }
        .product-info b { color: var(--gold-light); font-size: 0.8rem; }

        .input-box { background: rgba(0,0,0,0.5); border: 1px solid var(--border-gold); color: white; padding: 10px 12px; border-radius: 10px; font-size: 0.75rem; outline: none; width: 100%; transition: 0.3s; }
        .btn-action { background: linear-gradient(to bottom, var(--gold-light), var(--gold)); color: var(--dark-blue); border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.65rem; transition: 0.2s; display: flex; align-items: center; gap: 5px; justify-content: center; }
        .btn-danger { background: linear-gradient(135deg, #ff4d4d, #c0392b); color: white; }
        .btn-flash { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; }
        .btn-done { background: var(--success); color: white; flex: 1; padding: 10px; border-radius: 8px; font-weight: 700; border: none; font-size: 0.7rem; }
        .btn-cancel { background: var(--danger); color: white; flex: 1; padding: 10px; border-radius: 8px; font-weight: 700; border: none; font-size: 0.7rem; }

        .banner-preview-item { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 10px; border: 1px solid var(--border-gold); margin-bottom: 5px; }
        .banner-preview-item img { width: 45px; height: 30px; object-fit: cover; border-radius: 6px; }

        .switch { position: relative; display: inline-block; width: 34px; height: 18px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(16px); }

        .status-msg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--dark-blue); padding: 10px 25px; border-radius: 50px; font-weight: 800; display: none; z-index: 1000; font-size: 0.75rem; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .swal-input-label { display: block; text-align: left; margin-top: 10px; font-size: 0.7rem; color: var(--gold-light); text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <i class="fas fa-crown" style="font-size: 2rem; color: var(--gold); margin-bottom: 10px;"></i>
            <h2 style="color: var(--gold); font-size: 1.2rem;">OWNER ACCESS</h2>
            <input type="password" id="admin-key-input" class="key-input" placeholder="••••••">
            <button class="btn-action" style="width:100%; padding: 15px;" onclick="checkKey()">LOGIN SYSTEM</button>
        </div>
    </div>

    <div id="admin-content">
        <div class="admin-container">
            <div class="header">
                <div>
                    <h2 style="color: var(--gold); font-size: 1rem;"><i class="fas fa-tools"></i> 757 PANEL</h2>
                    <p style="font-size: 0.55rem; opacity: 0.6;">DASHBOARD PENGELOLAAN WARUNG</p>
                </div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-id-card"></i> Nama Brand & Logo Utama</div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <input type="text" id="site-name-input" class="input-box" placeholder="Nama Brand">
                    <input type="text" id="logo-url-input" class="input-box" placeholder="URL Logo Utama">
                    <button class="btn-action" onclick="updateSiteIdentity()">Simpan Identitas</button>
                </div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-shopping-cart"></i> Pesanan Masuk (DIPROSES)</div>
                <div id="order-list"></div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-th-large"></i> Kelola Kategori Pilihan (Grid)</div>
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 10px;">
                    <input type="text" id="cat-new-name" class="input-box" style="margin-bottom:5px;" placeholder="Nama Game">
                    <input type="text" id="cat-new-img" class="input-box" style="margin-bottom:5px;" placeholder="URL Gambar Ikon">
                    <input type="text" id="cat-new-link" class="input-box" style="margin-bottom:5px;" placeholder="Link (topup-ml.html)">
                    <select id="cat-new-type" class="input-box" style="margin-bottom:8px; background: #16215b; color: white;">
                        <option value="topup">Top Up</option>
                        <option value="item">Item Game</option>
                        <option value="sosmed">Sosmed</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                    <button class="btn-action" style="width:100%" onclick="addNewCategory()"><i class="fas fa-plus"></i> Tambah ke Grid</button>
                </div>
                <div id="admin-category-list"></div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-box-open"></i> Kelola Koleksi Akun</div>
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 10px;">
                    <input type="text" id="stock-new-title" class="input-box" style="margin-bottom:5px;" placeholder="Judul Akun">
                    <input type="number" id="stock-new-price" class="input-box" style="margin-bottom:5px;" placeholder="Harga">
                    <input type="number" id="stock-new-qty" class="input-box" style="margin-bottom:5px;" placeholder="Jumlah Stok">
                    <input type="text" id="stock-new-img" class="input-box" style="margin-bottom:5px;" placeholder="URL Gambar Akun">
                    <textarea id="stock-new-desc" class="input-box" style="margin-bottom:8px; height: 60px; resize: none;" placeholder="Deskripsi Akun"></textarea>
                    <button class="btn-action" style="width:100%" onclick="addNewStock()"><i class="fas fa-plus"></i> Tambah Stok Akun</button>
                </div>
                <div id="admin-stock-list"></div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-robot"></i> Atur Harga Roblox</div>
                <div id="roblox-list-admin"></div>
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-top: 15px;">
                    <input type="text" id="rbx-new-id" class="input-box" style="margin-bottom:5px;" placeholder="ID (rbx_500)">
                    <input type="text" id="rbx-new-name" class="input-box" style="margin-bottom:5px;" placeholder="Nama (500 Robux)">
                    <input type="number" id="rbx-new-price" class="input-box" style="margin-bottom:8px;" placeholder="Harga">
                    <button class="btn-action" style="width:100%" onclick="addOrUpdateProduct('ROBLOX')">Tambah Roblox</button>
                </div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-gem"></i> Atur Harga Zepeto</div>
                <div id="zepeto-list-admin"></div>
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-top: 15px;">
                    <input type="text" id="zep-new-id" class="input-box" style="margin-bottom:5px;" placeholder="ID (zep_14)">
                    <input type="text" id="zep-new-name" class="input-box" style="margin-bottom:5px;" placeholder="Nama (14 Zems)">
                    <input type="number" id="zep-new-price" class="input-box" style="margin-bottom:8px;" placeholder="Harga">
                    <button class="btn-action" style="width:100%" onclick="addOrUpdateProduct('ZEPETO')">Tambah Zepeto</button>
                </div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fab fa-discord"></i> Atur Harga Discord</div>
                <div id="discord-list-admin"></div>
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-top: 15px;">
                    <input type="text" id="dsc-new-id" class="input-box" style="margin-bottom:5px;" placeholder="ID (dsc_nitro)">
                    <input type="text" id="dsc-new-name" class="input-box" style="margin-bottom:5px;" placeholder="Nama (Nitro)">
                    <input type="number" id="dsc-new-price" class="input-box" style="margin-bottom:8px;" placeholder="Harga">
                    <button class="btn-action" style="width:100%" onclick="addOrUpdateProduct('DISCORD')">Tambah Discord</button>
                </div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-bullhorn"></i> Running Text</div>
                <textarea id="announcement-input" class="input-box" style="height: 60px; margin-bottom:8px;" placeholder="Tulis pengumuman..."></textarea>
                <button class="btn-action" style="width:100%" onclick="addAnnouncement()">Tambah Pengumuman</button>
                <div id="admin-announcement-list" style="margin-top:10px;"></div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-image"></i> Popup & Banner</div>
                <input type="text" id="popup-url-input" class="input-box" placeholder="URL Banner Popup">
                <button class="btn-action" style="width:100%; margin: 8px 0;" onclick="updateSiteVisuals()">Simpan Popup</button>
                <hr style="opacity:0.1; margin: 10px 0;">
                <input type="text" id="new-banner-url" class="input-box" placeholder="URL Banner Slider">
                <button class="btn-action" style="width:100%; margin-top:8px;" onclick="addSliderBanner()">Tambah Slider</button>
                <div id="admin-banner-slider-list" style="margin-top:10px;"></div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-fire"></i> Flash Sale Manual</div>
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 10px;">
                    <input type="text" id="manual-promo-name" class="input-box" style="margin-bottom:5px;" placeholder="Nama Produk">
                    <input type="number" id="manual-promo-price" class="input-box" style="margin-bottom:5px;" placeholder="Harga Promo">
                    <input type="number" id="manual-promo-old" class="input-box" style="margin-bottom:5px;" placeholder="Harga Lama">
                    <button class="btn-action" style="width:100%" onclick="addPromoManual()">Aktifkan Flash Sale</button>
                </div>
                <div id="promo-admin-list"></div>
            </div>
        </div>
    </div>

    <div id="status-pop" class="status-msg">Berhasil!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDU-cVQatcbyA-RSM-zftZf1NH5q9fcFI",
            authDomain: "warung-757.firebaseapp.com",
            projectId: "warung-757",
            databaseURL: "https://warung-757-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const MY_SECRET_KEY = "031004"; 

        window.checkKey = function() {
            if(document.getElementById('admin-key-input').value === MY_SECRET_KEY) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                initDashboard();
            } else { 
                Swal.fire('Gagal', 'Sandi Salah!', 'error');
            }
        }

        function initDashboard() {
            // Site Content Listener
            onValue(ref(db, 'site_content'), (snap) => {
                const d = snap.val(); if(!d) return;
                document.getElementById('site-name-input').value = d.brand_name || "";
                document.getElementById('logo-url-input').value = d.logo_url || "";
                document.getElementById('popup-url-input').value = d.popup_banner || "";
                
                // Categories
                const catList = document.getElementById('admin-category-list');
                catList.innerHTML = "";
                if(d.categories) Object.keys(d.categories).forEach(key => {
                    const c = d.categories[key];
                    catList.innerHTML += `
                    <div class="product-card">
                        <div class="product-info"><b>${c.name}</b><br><small>${c.type}</small></div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <button class="btn-action" onclick="editCategory('${key}')"><i class="fas fa-edit"></i></button>
                            <label class="switch">
                                <input type="checkbox" ${c.status !== "closed" ? 'checked' : ''} onchange="toggleCategoryStatus('${key}', this)">
                                <span class="slider"></span>
                            </label>
                            <button class="btn-action btn-danger" onclick="deleteMasterData('categories/${key}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                });

                // Announcements
                const annList = document.getElementById('admin-announcement-list');
                annList.innerHTML = "";
                if(d.announcements) {
                    const anns = Array.isArray(d.announcements) ? d.announcements : [d.announcements];
                    anns.forEach((text, i) => {
                        annList.innerHTML += `
                        <div class="product-card">
                            <div class="product-info">${text}</div>
                            <div style="display:flex; gap:5px;">
                                <button class="btn-action" onclick="editAnnouncement(${i}, '${text.replace(/'/g, "\\'")}')"><i class="fas fa-edit"></i></button>
                                <button class="btn-action btn-danger" onclick="deleteAnnouncement(${i})"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>`;
                    });
                }

                // Slider Banners
                const bannerList = document.getElementById('admin-banner-slider-list');
                bannerList.innerHTML = "";
                if(d.banners) d.banners.forEach((url, i) => {
                    bannerList.innerHTML += `<div class="banner-preview-item"><img src="${url}"><div class="product-info">Banner ${i+1}</div><button class="btn-action btn-danger" onclick="deleteSliderBanner(${i})"><i class="fas fa-trash"></i></button></div>`;
                });

                // Flash Sales
                const promoList = document.getElementById('promo-admin-list');
                promoList.innerHTML = "";
                if(d.promos) d.promos.forEach((p, i) => {
                    promoList.innerHTML += `<div class="product-card" style="border-left: 3px solid var(--danger);"><div class="product-info"><b>${p.name}</b><br>Rp ${p.price.toLocaleString()}</div><button class="btn-action btn-danger" onclick="deletePromoItem(${i})"><i class="fas fa-trash"></i></button></div>`;
                });
            });

            // Account Stocks Listener
            onValue(ref(db, 'site_content/account_stocks'), (snap) => {
                const list = document.getElementById('admin-stock-list');
                list.innerHTML = ""; const data = snap.val();
                if(data) Object.keys(data).forEach(key => {
                    const item = data[key];
                    list.innerHTML += `<div class="product-card"><div class="product-info"><b>${item.title}</b> (Stok: ${item.qty})<br>Rp ${item.price.toLocaleString()}</div><div style="display:flex; gap:5px;"><button class="btn-action" onclick="editStock('${key}')"><i class="fas fa-edit"></i></button><button class="btn-action btn-danger" onclick="deleteMasterData('account_stocks/${key}')"><i class="fas fa-trash"></i></button></div></div>`;
                });
            });

            // Transactions Listener
            onValue(ref(db, 'transactions'), (snap) => {
                const list = document.getElementById('order-list');
                list.innerHTML = ""; const data = snap.val();
                if(data) Object.keys(data).reverse().forEach(key => {
                    const trx = data[key];
                    if(trx.status === "DIPROSES") {
                        list.innerHTML += `<div class="product-card" style="flex-direction:column; align-items:start;"><div class="product-info"><b>${trx.product}</b><br>User: ${trx.username || trx.userId || trx.idz || 'N/A'}<br>Rp ${trx.price.toLocaleString()}</div><div style="display:flex; gap:10px; width:100%; margin-top:5px;"><button class="btn-done" onclick="updateStatus('${key}', 'BERHASIL')">BERHASIL</button><button class="btn-cancel" onclick="updateStatus('${key}', 'GAGAL')">GAGAL</button></div></div>`;
                    }
                });
            });

            // Prices Listeners
            onValue(ref(db, 'settings/zepeto_prices'), snap => renderPriceList('ZEPETO', snap.val(), 'zepeto-list-admin'));
            onValue(ref(db, 'settings/roblox_prices'), snap => renderPriceList('ROBLOX', snap.val(), 'roblox-list-admin'));
            onValue(ref(db, 'settings/discord_prices'), snap => renderPriceList('DISCORD', snap.val(), 'discord-list-admin'));
        }

        function renderPriceList(type, data, elementId) {
            const list = document.getElementById(elementId);
            list.innerHTML = ""; if(!data) return;
            data.forEach((p, i) => {
                list.innerHTML += `<div class="product-card"><div class="product-info"><b>${p.name}</b><br>Rp ${p.price.toLocaleString()}</div><div style="display:flex; gap:5px;"><button class="btn-action" onclick="editHarga('${type}', ${i}, '${p.name}', ${p.price})"><i class="fas fa-edit"></i></button><button class="btn-action btn-flash" onclick="makeFlashSale('${type}', ${i})"><i class="fas fa-bolt"></i></button><button class="btn-action btn-danger" onclick="deleteProduct('${type}', ${i})"><i class="fas fa-trash"></i></button></div></div>`;
            });
            if(type === 'ZEPETO') window.currentZepetoData = data;
            if(type === 'ROBLOX') window.currentRobloxData = data;
            if(type === 'DISCORD') window.currentDiscordData = data;
        }

        // --- ACTION FUNCTIONS ---
        window.updateSiteIdentity = () => update(ref(db, 'site_content'), { brand_name: document.getElementById('site-name-input').value, logo_url: document.getElementById('logo-url-input').value }).then(() => showToast("Identitas Disimpan"));
        window.updateSiteVisuals = () => update(ref(db, 'site_content'), { popup_banner: document.getElementById('popup-url-input').value }).then(() => showToast("Popup Disimpan"));
        window.updateStatus = (key, status) => update(ref(db, `transactions/${key}`), { status }).then(() => showToast("Status Diperbarui"));
        window.deleteMasterData = (path) => remove(ref(db, 'site_content/' + path)).then(() => showToast("Dihapus"));
        
        window.toggleCategoryStatus = (key, el) => update(ref(db, `site_content/categories/${key}`), { status: el.checked ? "open" : "closed" }).then(() => showToast("Status Kategori Berubah"));

        window.addNewCategory = () => {
            const name = document.getElementById('cat-new-name').value;
            const image = document.getElementById('cat-new-img').value;
            const link = document.getElementById('cat-new-link').value;
            const type = document.getElementById('cat-new-type').value;
            if(!name || !image) return;
            set(ref(db, 'site_content/categories/cat_' + Date.now()), { name, image, link, type, status: "open" }).then(() => {
                document.getElementById('cat-new-name').value = ""; document.getElementById('cat-new-img').value = "";
                showToast("Kategori Ditambah");
            });
        };

        window.addNewStock = () => {
            const title = document.getElementById('stock-new-title').value;
            const price = parseInt(document.getElementById('stock-new-price').value);
            const qty = parseInt(document.getElementById('stock-new-qty').value);
            const image = document.getElementById('stock-new-img').value;
            const description = document.getElementById('stock-new-desc').value;
            if(!title || isNaN(price)) return;
            set(ref(db, 'site_content/account_stocks/stock_' + Date.now()), { title, price, qty, image, description }).then(() => {
                ['stock-new-title', 'stock-new-price', 'stock-new-qty', 'stock-new-img', 'stock-new-desc'].forEach(id => document.getElementById(id).value = "");
                showToast("Stok Ditambah");
            });
        };

        window.addOrUpdateProduct = (type) => {
            let prefix = type === 'ZEPETO' ? 'zep' : (type === 'ROBLOX' ? 'rbx' : 'dsc');
            let dbPath = `settings/${type.toLowerCase()}_prices`;
            const id = document.getElementById(`${prefix}-new-id`).value;
            const name = document.getElementById(`${prefix}-new-name`).value;
            const price = parseInt(document.getElementById(`${prefix}-new-price`).value);
            if(!id || !name || isNaN(price)) return;
            get(ref(db, dbPath)).then(snap => {
                let data = snap.val() || [];
                data.push({ id, name, price });
                set(ref(db, dbPath), data).then(() => {
                    [`${prefix}-new-id`, `${prefix}-new-name`, `${prefix}-new-price`].forEach(id => document.getElementById(id).value = "");
                    showToast(type + " Ditambah");
                });
            });
        };

        window.addAnnouncement = () => {
            const text = document.getElementById('announcement-input').value;
            if(!text) return;
            get(ref(db, 'site_content/announcements')).then(snap => {
                let data = snap.val() || [];
                if(!Array.isArray(data)) data = [data];
                data.push(text);
                set(ref(db, 'site_content/announcements'), data).then(() => {
                    document.getElementById('announcement-input').value = "";
                    showToast("Pengumuman Ditambah");
                });
            });
        };

        window.deleteAnnouncement = (i) => {
            get(ref(db, 'site_content/announcements')).then(snap => {
                let data = snap.val();
                data.splice(i, 1);
                set(ref(db, 'site_content/announcements'), data);
            });
        };

        window.addSliderBanner = () => {
            const url = document.getElementById('new-banner-url').value;
            if(!url) return;
            get(ref(db, 'site_content/banners')).then(snap => {
                let data = snap.val() || [];
                data.push(url);
                set(ref(db, 'site_content/banners'), data).then(() => {
                    document.getElementById('new-banner-url').value = "";
                    showToast("Banner Ditambah");
                });
            });
        };

        window.deleteSliderBanner = (i) => {
            get(ref(db, 'site_content/banners')).then(snap => {
                let data = snap.val();
                data.splice(i, 1);
                set(ref(db, 'site_content/banners'), data);
            });
        };

        window.addPromoManual = () => {
            const name = document.getElementById('manual-promo-name').value;
            const price = parseInt(document.getElementById('manual-promo-price').value);
            const old_price = parseInt(document.getElementById('manual-promo-old').value);
            if(!name || isNaN(price)) return;
            get(ref(db, 'site_content/promos')).then(snap => {
                let data = snap.val() || [];
                data.push({ name, price, old_price, image: "https://i.ibb.co.com/S45mRNn7/Robux-2019-Logo-gold-svg-1.png" });
                set(ref(db, 'site_content/promos'), data).then(() => showToast("Flash Sale Aktif"));
            });
        };

        window.deletePromoItem = (i) => {
            get(ref(db, 'site_content/promos')).then(snap => {
                let data = snap.val();
                data.splice(i, 1);
                set(ref(db, 'site_content/promos'), data);
            });
        };

        window.deleteProduct = (type, i) => {
            let path = `settings/${type.toLowerCase()}_prices`;
            get(ref(db, path)).then(snap => {
                let data = snap.val();
                data.splice(i, 1);
                set(ref(db, path), data);
            });
        };

        // --- EDITING SWEETALERTS ---
        window.editAnnouncement = (i, oldText) => {
            Swal.fire({
                title: 'Edit Pengumuman',
                input: 'textarea',
                inputValue: oldText,
                showCancelButton: true
            }).then(res => {
                if(res.isConfirmed) {
                    get(ref(db, 'site_content/announcements')).then(snap => {
                        let data = snap.val(); data[i] = res.value;
                        set(ref(db, 'site_content/announcements'), data);
                    });
                }
            });
        };

        window.editCategory = (key) => {
            get(ref(db, `site_content/categories/${key}`)).then(snap => {
                const c = snap.val();
                Swal.fire({
                    title: 'Edit Kategori',
                    html: `<input id="e-cat-n" class="swal2-input" value="${c.name}">
                           <input id="e-cat-i" class="swal2-input" value="${c.image}">
                           <input id="e-cat-l" class="swal2-input" value="${c.link}">`,
                    preConfirm: () => ({ name: document.getElementById('e-cat-n').value, image: document.getElementById('e-cat-i').value, link: document.getElementById('e-cat-l').value })
                }).then(res => {
                    if(res.isConfirmed) update(ref(db, `site_content/categories/${key}`), res.value);
                });
            });
        };

        window.editStock = (key) => {
            get(ref(db, `site_content/account_stocks/${key}`)).then(snap => {
                const s = snap.val();
                Swal.fire({
                    title: 'Edit Stok',
                    html: `<input id="e-st-t" class="swal2-input" value="${s.title}">
                           <input id="e-st-p" type="number" class="swal2-input" value="${s.price}">
                           <input id="e-st-q" type="number" class="swal2-input" value="${s.qty}">
                           <input id="e-st-i" class="swal2-input" value="${s.image}">`,
                    preConfirm: () => ({ title: document.getElementById('e-st-t').value, price: parseInt(document.getElementById('e-st-p').value), qty: parseInt(document.getElementById('e-st-q').value), image: document.getElementById('e-st-i').value, description: s.description })
                }).then(res => {
                    if(res.isConfirmed) update(ref(db, `site_content/account_stocks/${key}`), res.value);
                });
            });
        };

        window.editHarga = (type, i, name, oldP) => {
            Swal.fire({ title: 'Edit Harga ' + name, input: 'number', inputValue: oldP }).then(res => {
                if(res.isConfirmed) {
                    let path = `settings/${type.toLowerCase()}_prices`;
                    get(ref(db, path)).then(snap => {
                        let data = snap.val(); data[i].price = parseInt(res.value);
                        set(ref(db, path), data);
                    });
                }
            });
        };

        window.makeFlashSale = (type, i) => {
            let item = type === 'ZEPETO' ? window.currentZepetoData[i] : (type === 'ROBLOX' ? window.currentRobloxData[i] : window.currentDiscordData[i]);
            Swal.fire({ title: 'Set Flash Sale', html: `<input id="p-price" class="swal2-input" type="number" value="${item.price}">`, preConfirm: () => document.getElementById('p-price').value }).then(res => {
                if(res.isConfirmed) {
                    get(ref(db, 'site_content/promos')).then(snap => {
                        let data = snap.val() || [];
                        let img = type === 'ZEPETO' ? "https://files.catbox.moe/5m3l0z.jpg" : (type === 'DISCORD' ? "https://cdn.worldvectorlogo.com/logos/discord-6.svg" : "https://i.ibb.co.com/S45mRNn7/Robux-2019-Logo-gold-svg-1.png");
                        data.push({ name: item.name, price: parseInt(res.value), old_price: item.price, image: img });
                        set(ref(db, 'site_content/promos'), data);
                    });
                }
            });
        };

        function showToast(m) { const t = document.getElementById('status-pop'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }
    </script>
</body>
</html>
