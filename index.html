<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warpung | Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* --- TEMA WARNA WARPUNG --- */
        :root {
            --dark-blue: #0c0908; 
            --royal-blue: #1a1412; 
            --gold: #c68a41; 
            --gold-light: #eec185; 
            --white: #ffffff;
            --danger: #ff4d4d;
        }

        /* --- ANIMASI --- */
        @keyframes pulse-flash {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; color: var(--gold-light); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--dark-blue); font-family: 'Poppins', sans-serif; color: var(--white); overflow-x: hidden; }

        .main-wrapper { 
            width: 100%; 
            background: var(--dark-blue); 
            background-image: radial-gradient(circle at 20% 30%, rgba(198, 138, 65, 0.15) 0%, transparent 50%);
            min-height: 100vh; 
            position: relative; 
        }

        /* --- HEADER & LOGO (UKURAN DIPERBESAR) --- */
        .header-bar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 10px 5%; 
            background: rgba(12, 9, 8, 0.9); 
            backdrop-filter: blur(15px); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(198, 138, 65, 0.3); 
        }
        .brand img { 
            height: 70px; /* Ukuran diperbesar */
            width: auto; 
            transition: 0.4s ease;
            filter: drop-shadow(0 0 8px rgba(198, 138, 65, 0.4));
        }
        @media (max-width: 768px) {
            .brand img { height: 60px; } /* Ukuran HP */
        }

        .btn-menu { 
            background: rgba(198, 138, 65, 0.1); 
            border: 1px solid var(--gold); 
            width: 45px; 
            height: 45px; 
            border-radius: 12px; 
            color: var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
        }

        /* --- BANNER --- */
        .banner-wrapper { position: relative; width: 100%; height: 400px; overflow: hidden; border-bottom: 2px solid var(--gold); }
        @media (max-width: 768px) { .banner-wrapper { height: 220px; } }
        .swiper-banner img { width: 100%; height: 100%; object-fit: cover; }
        .swiper-pagination-bullet-active { background: var(--gold); opacity: 1; }

        /* --- ANNOUNCEMENT --- */
        .announcement-bar { margin: 15px 5% 0; background: rgba(198, 138, 65, 0.1); border-radius: 12px; padding: 10px 0; display: flex; align-items: center; overflow: hidden; border: 1px solid rgba(198, 138, 65, 0.2); }
        .announcement-icon { padding: 0 15px; color: var(--gold); border-right: 1px solid rgba(198,138,65,0.2); }
        .announcement-text { white-space: nowrap; animation: marquee 20s linear infinite; font-size: 0.8rem; font-weight: 600; }

        /* --- FLASH SALE --- */
        .promo-section { margin: 25px 0; }
        .product-item-flash { 
            background: rgba(198, 138, 65, 0.05); 
            border: 1px solid rgba(198, 138, 65, 0.3); 
            padding: 15px; border-radius: 12px; 
            display: flex; flex-direction: column; gap: 5px;
        }
        .flash-badge-mini { background: var(--gold); color: #000; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; align-self: flex-start; }
        .product-name-flash { font-size: 0.85rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .price-old-flash { text-decoration: line-through; opacity: 0.5; font-size: 0.7rem; margin-right: 5px; }
        .product-price-flash { color: var(--gold-light); font-weight: 800; font-size: 0.9rem; }

        /* --- CATEGORY TABS --- */
        .category-tabs { display: flex; overflow-x: auto; padding: 10px 5%; gap: 10px; scrollbar-width: none; }
        .tab-item { white-space: nowrap; padding: 10px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(198, 138, 65, 0.2); border-radius: 30px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .tab-item.active { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(198, 138, 65, 0.4); }

        /* --- CATEGORY GRID --- */
        .category-grid-2x2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 0 5%; }
        @media (max-width: 480px) { .category-grid-2x2 { grid-template-columns: 1fr 1fr; } }
        .category-card-medium { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(198, 138, 65, 0.2); 
            border-radius: 18px; padding: 20px 10px; 
            text-decoration: none; color: white; text-align: center; 
            transition: 0.3s; position: relative;
        }
        .cat-img-box-large { width: 65px; height: 65px; border-radius: 15px; overflow: hidden; margin: 0 auto 10px; border: 1.5px solid var(--gold); }
        .cat-game-img { width: 100%; height: 100%; object-fit: cover; }
        .cat-name-bold { font-size: 0.8rem; font-weight: 700; display: block; }
        .cat-status-label { position: absolute; top: 8px; right: 8px; font-size: 0.55rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
        .status-open { background: #00ff88; color: #000; }
        .status-closed { background: var(--danger); color: #fff; }

        /* --- FOOTER & LOGO (UKURAN DIPERBESAR) --- */
        .footer-premium { background: rgba(0, 0, 0, 0.4); padding: 50px 5% 20px; margin-top: 50px; border-top: 1px solid rgba(198,138,65,0.1); }
        .footer-logo-text img { 
            height: 85px; /* Ukuran diperbesar */
            width: auto; 
            margin-bottom: 20px;
            filter: drop-shadow(0 0 5px rgba(198, 138, 65, 0.3));
        }
        @media (max-width: 768px) {
            .footer-logo-text img { height: 75px; }
        }
        .footer-desc { font-size: 0.85rem; opacity: 0.7; line-height: 1.6; max-width: 400px; }
        .footer-bottom { margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }

        /* --- SIDEBAR --- */
        .sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: #1a1412; z-index: 2000; transition: 0.5s; padding: 30px; border-left: 2px solid var(--gold); }
        .sidebar.active { right: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 1500; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <header class="header-bar">
            <div class="brand">
                <img id="nav-logo" src="https://via.placeholder.com/200x80?text=Warpung" alt="Warpung Logo">
            </div>
            <div class="btn-menu" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        </header>

        <div class="overlay" id="overlay" onclick="closeAll()"></div>

        <div class="sidebar" id="sidebar">
            <h2 style="color: var(--gold); margin-bottom: 30px;">Menu</h2>
            <a href="mailto:757.warung@gmail.com" style="color: white; text-decoration: none; display: block; margin-bottom: 20px;"><i class="fas fa-envelope"></i> Hubungi Admin</a>
            <a href="riwayat-transaksi.html" style="color: white; text-decoration: none; display: block;"><i class="fas fa-history"></i> Riwayat Transaksi</a>
        </div>

        <div class="container">
            <div class="banner-wrapper">
                <div class="swiper swiper-banner">
                    <div class="swiper-wrapper" id="banner-display-list"></div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>

            <div class="announcement-bar">
                <div class="announcement-icon"><i class="fas fa-bullhorn"></i></div>
                <div class="announcement-text" id="announcement-text-display">Memuat pengumuman terbaru...</div>
            </div>

            <div class="promo-section" id="promo-area" style="display: none;">
                <div class="section-title" style="margin-left: 5%; color: var(--gold); font-weight: 800; margin-bottom: 15px;">
                    <i class="fas fa-bolt" style="animation: pulse-flash 1s infinite;"></i> FLASH SALE TERBATAS
                </div>
                <div class="swiper promo-swiper" style="padding: 0 5%;">
                    <div class="swiper-wrapper" id="promo-display-list"></div>
                </div>
            </div>

            <div class="category-tabs">
                <div class="tab-item active" onclick="filterData('all', this)">Semua</div>
                <div class="tab-item" onclick="filterData('topup', this)">Top Up</div>
                <div class="tab-item" onclick="filterData('item', this)">Item</div>
                <div class="tab-item" onclick="filterData('sosmed', this)">Sosmed</div>
                <div class="tab-item" onclick="filterData('akun', this)">Akun</div>
            </div>

            <div class="main-content">
                <div id="category-section-wrapper">
                    <div class="section-title" id="grid-title" style="margin: 25px 5% 15px; color: var(--gold); font-weight: 800;">KATEGORI PILIHAN</div>
                    <div class="category-grid-2x2" id="category-display-list"></div>
                </div>

                <footer class="footer-premium">
                    <div class="footer-info">
                        <div class="footer-logo-text">
                            <img id="footer-logo" src="https://via.placeholder.com/200x80?text=Warpung" alt="Warpung">
                        </div>
                        <p class="footer-desc">Warpung adalah pusat Top Up & kebutuhan Gaming terpercaya. Aman, murah, dan proses cepat yang terjaga kualitasnya.</p>
                    </div>
                    <div class="footer-bottom">
                        <p style="font-size: 0.75rem; opacity: 0.5;">© 2026 Warpung. All Rights Reserved.</p>
                        <div class="social-icons" style="display: flex; gap: 15px;">
                            <a href="https://instagram.com/warung.757" style="color: var(--gold);"><i class="fab fa-instagram fa-lg"></i></a>
                            <a href="mailto:757.warung@gmail.com" style="color: var(--gold);"><i class="fas fa-envelope fa-lg"></i></a>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDU-cVQatcbyA-RSM-zftZf1NH5q9fcFI",
            authDomain: "warung-757.firebaseapp.com",
            projectId: "warung-757",
            databaseURL: "https://warung-757-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Sidebar logic
        window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').style.display = 'block'; };
        window.closeAll = () => { document.getElementById('sidebar').classList.remove('active'); document.getElementById('overlay').style.display = 'none'; };

        function cleanUrl(u) { 
            if (!u || u === '' || u === 'undefined') return 'https://via.placeholder.com/300?text=No+Image';
            return u.trim().replace('http://', 'https://');
        }

        let allCategories = {};

        // Render Categories
        function renderCategories(catData) {
            const list = document.getElementById('category-display-list');
            list.innerHTML = Object.keys(catData).map(k => {
                const c = catData[k];
                const isOpen = c.status !== 'closed';
                return `
                    <a href="${isOpen ? (c.link || '#') : 'javascript:void(0)'}" class="category-card-medium" style="${!isOpen ? 'filter:grayscale(1); opacity:0.6;' : ''}">
                        <div class="cat-status-label ${isOpen ? 'status-open' : 'status-closed'}">${isOpen ? 'OPEN' : 'CLOSED'}</div>
                        <div class="cat-img-box-large"><img src="${cleanUrl(c.image)}" class="cat-game-img"></div>
                        <span class="cat-name-bold">${c.name.toUpperCase()}</span>
                    </a>`;
            }).join('');
        }

        // Filter Logic
        window.filterData = (type, el) => {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            if (type === 'all') {
                renderCategories(allCategories);
            } else {
                const filtered = Object.keys(allCategories)
                    .filter(key => (allCategories[key].type || '').toLowerCase() === type)
                    .reduce((obj, key) => { obj[key] = allCategories[key]; return obj; }, {});
                renderCategories(filtered);
            }
        };

        // Realtime Listener
        onValue(ref(db, 'site_content'), (snap) => {
            const data = snap.val();
            if(!data) return;
            
            // Update Logo dari Firebase
            if(data.logo_url) {
                const url = cleanUrl(data.logo_url);
                document.getElementById('nav-logo').src = url;
                document.getElementById('footer-logo').src = url;
            }

            // Update Announcement
            if(data.announcements) document.getElementById('announcement-text-display').innerText = data.announcements;

            // Update Banners
            if(data.banners) {
                document.getElementById('banner-display-list').innerHTML = data.banners.map(u => `<div class="swiper-slide"><img src="${cleanUrl(u)}"></div>`).join('');
                new Swiper(".swiper-banner", { loop: true, pagination: { el: ".swiper-pagination" }, autoplay: { delay: 4000 } });
            }

            // Update Promo
            if(data.promos && data.promos.length > 0) {
                document.getElementById('promo-area').style.display = 'block';
                document.getElementById('promo-display-list').innerHTML = data.promos.map(p => `
                    <div class="swiper-slide">
                        <div class="product-item-flash">
                            <div class="flash-badge-mini">SALE</div>
                            <div class="product-name-flash">${p.name}</div>
                            <div class="product-price-flash">
                                <span class="price-old-flash">Rp${p.old_price.toLocaleString()}</span>
                                Rp${p.price.toLocaleString()}
                            </div>
                        </div>
                    </div>`).join('');
                new Swiper(".promo-swiper", { slidesPerView: 2.2, spaceBetween: 15, autoplay: { delay: 3000 }, breakpoints: { 768: { slidesPerView: 4 } } });
            }

            // Load Categories
            if(data.categories) {
                allCategories = data.categories;
                renderCategories(allCategories);
            }
        });
    </script>
</body>
</html>
